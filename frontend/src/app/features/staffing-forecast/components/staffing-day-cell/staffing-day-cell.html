<button
  [attr.id]="cellId()"
  type="button"
  [class]="cellClass()"
  [attr.data-testid]="cellId()"
  [attr.data-ward-code]="wardCode()"
  [attr.data-date]="day().date"
  [attr.data-staffing-status]="status().kind"
  [attr.data-confidence-band]="band().kind"
  (click)="onActivate()"
>
  <div class="staffing-day-cell__top">
    <div class="staffing-day-cell__demand">
      @if (day().isCorrected) {
        <span class="staffing-day-cell__was" data-testid="forecast-demand">
          {{ day().forecastDemand }}
        </span>
      }
      <span class="staffing-day-cell__value">{{ day().effectiveDemand }}</span>
    </div>
    <div class="staffing-day-cell__planned">Plan {{ day().plannedStaffing }}</div>
  </div>

  <div class="staffing-day-cell__bottom">
    @if (day().canOverride) {
      <div
        class="staffing-day-cell__status"
        [class.text-short]="status().kind === 'short'"
        [class.text-surplus]="status().kind === 'surplus'"
        [class.text-balance]="status().kind === 'balanced'"
        data-testid="staffing-status"
      >
        <mat-icon class="staffing-day-cell__icon">
          {{
            status().kind === 'short'
              ? 'arrow_upward'
              : status().kind === 'surplus'
                ? 'arrow_downward'
                : 'remove'
          }}
        </mat-icon>
        <span class="staffing-day-cell__status-text">{{ status().label }}</span>
      </div>
    } @else {
      <div class="staffing-day-cell__locked">Locked · past</div>
    }

    <div class="staffing-day-cell__footer">
      <span data-testid="confidence-label">
        {{ formatConfidencePercent(day().confidence) }} · {{ band().label }}
      </span>
      @if (day().isCorrected) {
        <span class="staffing-day-cell__corrected" data-testid="corrected-marker">Corrected</span>
      }
    </div>
  </div>
</button>
