<button
  [attr.id]="cellId()"
  type="button"
  mat-button
  [class]="cellClass()"
  [attr.data-testid]="cellId()"
  [attr.data-ward-code]="wardCode()"
  [attr.data-date]="day().date"
  [attr.data-staffing-status]="status().kind"
  [attr.data-confidence-band]="band().kind"
  (click)="onActivate()"
>
  <div class="flex items-baseline gap-1.5">
    @if (day().isCorrected) {
      <span class="font-mono text-xs line-through opacity-60" data-testid="forecast-demand">
        {{ day().forecastDemand }}
      </span>
    }
    <span class="font-mono text-2xl leading-none tabular-nums">{{ day().effectiveDemand }}</span>
    <span class="font-mono text-xs opacity-60">/{{ day().plannedStaffing }}</span>
  </div>

  @if (day().canOverride) {
    <div
      class="mt-2 flex items-center gap-1 text-xs"
      [class.text-short]="status().kind === 'short'"
      [class.text-surplus]="status().kind === 'surplus'"
      [class.text-balance]="status().kind === 'balanced'"
      data-testid="staffing-status"
    >
      <mat-icon class="!text-base !h-4 !w-4">
        {{
          status().kind === 'short'
            ? 'arrow_upward'
            : status().kind === 'surplus'
              ? 'arrow_downward'
              : 'remove'
        }}
      </mat-icon>
      <span>{{ status().label }}</span>
    </div>

    @if (day().isCorrected) {
      <div class="mt-1 flex items-center gap-1 text-xs" data-testid="corrected-marker">
        <mat-icon class="!text-base !h-4 !w-4" color="primary">info</mat-icon>
        <span>Corrected</span>
      </div>
    } @else {
      <div class="mt-1 text-xs opacity-70" data-testid="confidence-label">
        conf {{ formatConfidencePercent(day().confidence) }} · {{ band().label }}
      </div>
    }
  } @else {
    <div class="mt-2 text-xs opacity-70">Locked · past</div>
    <div class="text-xs opacity-70" data-testid="confidence-label">
      conf {{ formatConfidencePercent(day().confidence) }} · {{ band().label }}
    </div>
  }
</button>
