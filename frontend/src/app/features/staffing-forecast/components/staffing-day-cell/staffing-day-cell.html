@if (day().canOverride) {
  <button
    [attr.id]="cellId()"
    type="button"
    class="staffing-day-cell tile glass-soft min-h-[5.5rem] w-full rounded-2xl px-3 py-3 text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/70"
    [attr.data-testid]="cellId()"
    [attr.data-ward-code]="wardCode()"
    [attr.data-date]="day().date"
  >
    <div class="staffing-day-cell__values relative z-[1] flex items-baseline gap-1.5">
      <span class="staffing-day-cell__effective-demand font-mono text-2xl leading-none tabular-nums">
        {{ day().effectiveDemand }}
      </span>
      <span class="staffing-day-cell__planned-staffing font-mono text-xs text-ink-faint">
        /{{ day().plannedStaffing }}
      </span>
    </div>
    <div class="staffing-day-cell__confidence relative z-[1] mt-2.5 text-[11px] text-ink-faint">
      conf {{ formatConfidencePercent(day().confidence) }}
    </div>
  </button>
} @else {
  <div
    [attr.id]="cellId()"
    class="staffing-day-cell staffing-day-cell--locked tile glass-soft min-h-[5.5rem] cursor-not-allowed rounded-2xl px-3 py-3 opacity-60"
    [attr.data-testid]="cellId()"
    [attr.data-ward-code]="wardCode()"
    [attr.data-date]="day().date"
  >
    <div class="staffing-day-cell__effective-demand relative z-[1] font-mono text-2xl leading-none tabular-nums">
      {{ day().effectiveDemand }}
    </div>
    <div class="staffing-day-cell__locked-label relative z-[1] mt-2.5 text-[11px] text-ink-soft">
      Locked · past
    </div>
    <div class="staffing-day-cell__confidence relative z-[1] text-[11px] text-ink-faint">
      conf {{ formatConfidencePercent(day().confidence) }}
    </div>
  </div>
}
