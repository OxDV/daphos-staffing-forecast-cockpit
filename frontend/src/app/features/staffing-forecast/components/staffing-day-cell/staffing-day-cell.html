@if (day().canOverride) {
  <button
    [attr.id]="cellId()"
    type="button"
    [class]="cellClass()"
    [attr.data-testid]="cellId()"
    [attr.data-ward-code]="wardCode()"
    [attr.data-date]="day().date"
    [attr.data-staffing-status]="status().kind"
    [attr.data-confidence-band]="band().kind"
    (click)="onActivate()"
  >
    <div class="staffing-day-cell__values relative z-[1] flex items-baseline gap-1.5">
      @if (day().isCorrected) {
        <span
          class="staffing-day-cell__forecast-demand font-mono text-xs text-ink-faint line-through"
          data-testid="forecast-demand"
        >
          {{ day().forecastDemand }}
        </span>
      }
      <span class="staffing-day-cell__effective-demand font-mono text-2xl leading-none tabular-nums">
        {{ day().effectiveDemand }}
      </span>
      <span class="staffing-day-cell__planned-staffing font-mono text-xs text-ink-faint">
        /{{ day().plannedStaffing }}
      </span>
    </div>

    <div
      class="staffing-day-cell__status relative z-[1] mt-2.5 flex items-center gap-1 text-[11px]"
      [class.text-short]="status().kind === 'short'"
      [class.text-surplus]="status().kind === 'surplus'"
      [class.text-balance]="status().kind === 'balanced'"
      data-testid="staffing-status"
    >
      <span aria-hidden="true">{{ status().marker }}</span>
      <span>{{ status().label }}</span>
    </div>

    @if (day().isCorrected) {
      <div
        class="staffing-day-cell__corrected relative z-[1] mt-1 flex items-center gap-1 text-[11px] text-accent"
        data-testid="corrected-marker"
      >
        <span aria-hidden="true">ⓘ</span>
        <span>Corrected</span>
      </div>
    } @else {
      <div
        class="staffing-day-cell__confidence relative z-[1] mt-1 text-[11px] text-ink-faint"
        data-testid="confidence-label"
      >
        conf {{ formatConfidencePercent(day().confidence) }} · {{ band().label }}
      </div>
    }
  </button>
} @else {
  <button
    [attr.id]="cellId()"
    type="button"
    [class]="cellClass() + ' cursor-pointer'"
    [attr.data-testid]="cellId()"
    [attr.data-ward-code]="wardCode()"
    [attr.data-date]="day().date"
    [attr.data-staffing-status]="status().kind"
    [attr.data-confidence-band]="band().kind"
    (click)="onActivate()"
  >
    <div class="staffing-day-cell__effective-demand relative z-[1] font-mono text-2xl leading-none tabular-nums">
      {{ day().effectiveDemand }}
    </div>
    <div class="staffing-day-cell__locked-label relative z-[1] mt-2.5 text-[11px] text-ink-soft">
      Locked · past
    </div>
    <div
      class="staffing-day-cell__confidence relative z-[1] text-[11px] text-ink-faint"
      data-testid="confidence-label"
    >
      conf {{ formatConfidencePercent(day().confidence) }} · {{ band().label }}
    </div>
  </button>
}
