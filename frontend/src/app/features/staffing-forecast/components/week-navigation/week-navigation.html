<header
  id="week-navigation"
  class="week-navigation glass flex flex-wrap items-center justify-between gap-3 rounded-3xl px-3 py-3 md:gap-4 md:px-5 md:py-4"
  data-testid="week-navigation"
>
  <div class="relative z-[1] flex min-w-0 flex-1 items-center gap-2 md:gap-3">
    <button
      id="week-previous-button"
      mat-icon-button
      type="button"
      aria-label="Previous week"
      data-testid="week-previous-button"
      (click)="previousWeek.emit()"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>

    <div id="week-range" class="min-w-0 flex-1 text-center md:min-w-52 md:flex-none">
      <div
        id="week-range-label"
        class="truncate text-sm font-semibold tracking-tight md:text-base"
        data-testid="week-range-label"
      >
        {{ weekRangeLabel() }}
      </div>
      <div
        id="week-number-label"
        class="text-[11px] uppercase tracking-[0.14em] text-ink-faint"
        data-testid="week-number-label"
      >
        {{ weekNumberLabel() }}
      </div>
    </div>

    <button
      id="week-next-button"
      mat-icon-button
      type="button"
      aria-label="Next week"
      data-testid="week-next-button"
      (click)="nextWeek.emit()"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <span
    id="week-today-badge"
    class="relative z-[1] shrink-0 rounded-full border border-accent/35 bg-accent/10 px-3 py-1.5 text-[11px] font-medium text-accent md:px-4 md:text-xs"
    data-testid="week-today-badge"
  >
    {{ todayLabel() }}
  </span>
</header>
