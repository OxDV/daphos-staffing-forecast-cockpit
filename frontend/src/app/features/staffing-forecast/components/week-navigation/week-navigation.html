<mat-toolbar
  id="week-navigation"
  class="week-navigation !h-auto !min-h-16 !rounded-2xl !bg-[var(--mat-sys-surface-container-lowest)] !px-3 !py-2"
  data-testid="week-navigation"
>
  <button
    id="week-previous-button"
    mat-icon-button
    type="button"
    aria-label="Previous week"
    data-testid="week-previous-button"
    (click)="previousWeek.emit()"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>

  <div id="week-range" class="min-w-52 text-center">
    <div id="week-range-label" class="text-base font-medium" data-testid="week-range-label">
      {{ weekRangeLabel() }}
    </div>
    <div
      id="week-number-label"
      class="text-xs uppercase tracking-wide opacity-70"
      data-testid="week-number-label"
    >
      {{ weekNumberLabel() }}
    </div>
  </div>

  <button
    id="week-next-button"
    mat-icon-button
    type="button"
    aria-label="Next week"
    data-testid="week-next-button"
    (click)="nextWeek.emit()"
  >
    <mat-icon>chevron_right</mat-icon>
  </button>

  <span class="flex-1"></span>

  <mat-chip id="week-today-badge" data-testid="week-today-badge">{{ todayLabel() }}</mat-chip>
</mat-toolbar>
